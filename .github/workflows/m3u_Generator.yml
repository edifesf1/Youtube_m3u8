name: M3U Generator

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python e dependências
        run: |
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      - name: Gerar playlist M3U
        run: |
          python3 << 'PYEOF'
import subprocess
import sys

def get_m3u8_url(channel_url):
    """Usa yt-dlp para extrair o link M3U8 de forma confiável"""
    try:
        result = subprocess.run(
            ["yt-dlp", "-g", channel_url],
            capture_output=True,
            text=True,
            timeout=60
        )
        if result.returncode == 0:
            url = result.stdout.strip()
            if url and '.m3u8' in url:
                return url
        return None
    except Exception as e:
        print(f"  Erro: {e}")
        return None

# Iniciar arquivo
with open("youtube.m3u", "w", encoding="utf-8") as f:
    f.write("#EXTM3U\n")

# Processar canais
with open("youtube_channel_info.txt", "r", encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if not line or line.startswith("#"):
            continue
        if "," not in line:
            continue
        
        name, url = line.split(",", 1)
        name = name.strip()
        url = url.strip()
        
        print(f"Buscando: {name}...")
        stream_url = get_m3u8_url(url)
        
        if stream_url:
            with open("youtube.m3u", "a", encoding="utf-8") as f:
                f.write(f"#EXTINF:-1,{name}\n{stream_url}\n")
            print(f"  ✅ Adicionado!")
        else:
            print(f"  ⚠️ Sem stream ativo no momento")

print("\nConcluído!")
PYEOF

      - name: Commit e push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u
          git commit -m "links atualizados" || echo "Sem alterações"
          git push
