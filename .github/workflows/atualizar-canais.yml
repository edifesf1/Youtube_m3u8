
name: Atualizar transmissões do YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-canais-youtube
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Deno para yt-dlp
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp yt-dlp-ejs

      - name: Consultar canais e atualizar youtube.txt
        run: python .github/scripts/atualizar_canais.py

      - name: Salvar alterações no GitHub
        run: |
          git add youtube.txt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza transmissões ao vivo"
            git push
          fi
