
name: Gerar playlist YouTube

on:
  push:
    paths:
      - "youtube.txt"
      - "generate_m3u.py"
      - ".github/workflows/generate.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar playlist
        run: python generate_m3u.py

      - name: Salvar playlist
        run: |
          git add youtube.m3u
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualizar playlist YouTube"
            git push
          fi
