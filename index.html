<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Youtube IPTV</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #fff; font-family: Arial, sans-serif; }
    header {
      display: flex; align-items: center; gap: 14px;
      background: #c00; padding: 12px 16px; min-height: 60px;
      position: sticky; top: 0; z-index: 5;
    }
    #menuBtn {
      border: 0; background: transparent; color: white; cursor: pointer;
      font-size: 30px; line-height: 1; padding: 3px 8px; border-radius: 5px;
    }
    #menuBtn:hover { background: rgba(255,255,255,.15); }
    #siteTitle { font-size: 22px; font-weight: bold; }
    #temaAtual { margin-left: auto; font-size: 14px; font-weight: normal; }
    main { max-width: 1000px; margin: auto; padding: 16px; }
    /* O player fica preso logo abaixo do cabeçalho enquanto a lista rola por trás. */
    #player {
      position: sticky;
      top: 60px;
      z-index: 4;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 8px 18px rgba(0,0,0,.55);
    }
    #player iframe { display: block; width: 100%; height: 100%; border: 0; }
    #status, #lista { position: relative; z-index: 1; }
    @media (max-width: 600px) {
      #player { top: 60px; }
    }
    #status { padding: 12px 0; color: #ccc; }
    #lista { display: grid; gap: 8px; }
    #lista button {
      width: 100%; padding: 15px; text-align: left; color: white;
      background: #292929; border: 1px solid #444; border-radius: 6px;
      font-size: 16px; cursor: pointer;
    }
    #lista button:focus, #lista button.ativo {
      border-color: #f44; background: #383030; outline: 2px solid #c00;
    }
    #drawerOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 9; display: none;
    }
    #drawerOverlay.aberto { display: block; }
    #drawer {
      width: min(320px, 86vw); height: 100%; overflow-y: auto;
      background: #1b1b1b; box-shadow: 4px 0 16px rgba(0,0,0,.4);
      padding: 0 0 20px;
    }
    .drawerHeader {
      display: flex; justify-content: space-between; align-items: center;
      background: #c00; padding: 17px 16px; font-size: 20px; font-weight: bold;
    }
    #closeMenu {
      border: 0; color: #fff; background: transparent; font-size: 28px; cursor: pointer;
    }
    .menuIntro { color: #bbb; font-size: 13px; padding: 15px 16px 8px; }
    #temasMenu { display: grid; }
    #temasMenu button {
      background: transparent; border: 0; color: #eee; text-align: left;
      padding: 14px 18px; font-size: 16px; cursor: pointer;
      border-bottom: 1px solid #333;
    }
    #temasMenu button:hover, #temasMenu button.ativo { background: #383030; color: #fff; border-left: 4px solid #f33; }
    @media (max-width: 600px) {
      #siteTitle { font-size: 19px; }
      #temaAtual { font-size: 12px; }
      main { padding: 10px; }
    }

    body.bloqueado { overflow: hidden; }
    #telaLogin {
      position: fixed; inset: 0; z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at top, #3a1010, #090909 65%);
    }
    #caixaLogin {
      width: min(420px, 100%); padding: 30px; border-radius: 16px;
      background: #1b1b1b; border: 1px solid #454545;
      box-shadow: 0 18px 60px rgba(0,0,0,.55); text-align: center;
    }
    #caixaLogin h1 { margin: 0 0 8px; font-size: 26px; }
    #caixaLogin p { color: #bbb; line-height: 1.5; }
    #campoLogin {
      width: 100%; padding: 14px; margin: 12px 0; border-radius: 8px;
      border: 1px solid #555; background: #101010; color: white;
      font-size: 18px; text-align: center; text-transform: uppercase;
    }
    #entrarLogin {
      width: 100%; padding: 14px; border: 0; border-radius: 8px;
      background: #c00; color: white; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    #entrarLogin:hover { background: #e11; }
    #erroLogin { min-height: 22px; color: #ff7777; font-size: 14px; }
    #sairLogin { margin-left: 10px; padding: 6px 9px; border: 1px solid #fff6;
      background: #7a0000; color: white; border-radius: 5px; cursor: pointer; }
    body.bloqueado > header, body.bloqueado > #drawerOverlay, body.bloqueado > main { visibility: hidden; }

  </style>
</head>
<body class="bloqueado">
  <section id="telaLogin" aria-label="Tela de login">
    <form id="caixaLogin">
      <h1>Youtube IPTV</h1>
      <p>Digite seu login de acesso para continuar.<br>Não é necessária senha.</p>
      <input id="campoLogin" name="login" autocomplete="off" autocapitalize="characters" placeholder="Ex.: YTXXXXXXXX" maxlength="10" required>
      <button id="entrarLogin" type="submit">ENTRAR</button>
      <div id="erroLogin" role="alert"></div>
    </form>
  </section>

  <header>
    <button id="menuBtn" aria-label="Abrir menu de temas" aria-expanded="false">☰</button>
    <div id="siteTitle">Youtube IPTV</div>
    <div id="temaAtual">Todos os temas</div>
    <button id="sairLogin" type="button" hidden>Sair</button>
  </header>

  <div id="drawerOverlay" aria-hidden="true">
    <nav id="drawer" aria-label="Menu de temas">
      <div class="drawerHeader">
        <span>Temas</span>
        <button id="closeMenu" aria-label="Fechar menu">×</button>
      </div>
      <div class="menuIntro">Escolha uma categoria para ver seus vídeos.</div>
      <div id="temasMenu"></div>
    </nav>
  </div>

  <main>
    <div id="player"></div>
    <div id="status">Carregando lista de vídeos...</div>
    <div id="lista"></div>
  </main>

      "YT7QIOW3QV",
      "YTZE2J8SA3",
      "YT3BCC5FTS"
    ];
    const telaLogin = document.getElementById("telaLogin");
    const campoLogin = document.getElementById("campoLogin");
    const erroLogin = document.getElementById("erroLogin");
    const sairLogin = document.getElementById("sairLogin");

    function liberarAcesso(login) {
      document.body.classList.remove("bloqueado");
      telaLogin.style.display = "none";
      sairLogin.hidden = false;
      sessionStorage.setItem("youtubeIptvLogin", login);
    }
    function validarLoginSalvo() {
      const salvo = sessionStorage.getItem("youtubeIptvLogin");
      if (salvo && LOGINS_VALIDOS.includes(salvo)) liberarAcesso(salvo);
    }
    document.getElementById("caixaLogin").addEventListener("submit", function(event) {
      event.preventDefault();
      const login = campoLogin.value.trim().toUpperCase();
      if (LOGINS_VALIDOS.includes(login)) {
        erroLogin.textContent = "";
        liberarAcesso(login);
      } else {
        erroLogin.textContent = "Login inválido. Confira o código e tente novamente.";
        campoLogin.select();
      }
    });
    sairLogin.addEventListener("click", function() {
      sessionStorage.removeItem("youtubeIptvLogin");
      location.reload();
    });
    validarLoginSalvo();

    let todosVideos = [];
    let videos = [];
    let player = null;
    let selecionado = 0;

    const status = document.getElementById("status");
    const lista = document.getElementById("lista");
    const temasMenu = document.getElementById("temasMenu");
    const temaAtual = document.getElementById("temaAtual");
    const overlay = document.getElementById("drawerOverlay");
    const menuBtn = document.getElementById("menuBtn");

    function temaDaURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("tema") || "Todos";
    }

    function abrirMenu() {
      overlay.classList.add("aberto");
      overlay.setAttribute("aria-hidden", "false");
      menuBtn.setAttribute("aria-expanded", "true");
    }

    function fecharMenu() {
      overlay.classList.remove("aberto");
      overlay.setAttribute("aria-hidden", "true");
      menuBtn.setAttribute("aria-expanded", "false");
    }

    menuBtn.addEventListener("click", abrirMenu);
    document.getElementById("closeMenu").addEventListener("click", fecharMenu);
    overlay.addEventListener("click", event => {
      if (event.target === overlay) fecharMenu();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") fecharMenu();
    });

    function extrairId(valor) {
      try {
        const url = new URL(valor);
        if (url.hostname === "youtu.be") {
          return url.pathname.split("/").filter(Boolean)[0] || null;
        }
        if (!["youtube.com", "www.youtube.com", "m.youtube.com",
              "youtube-nocookie.com", "www.youtube-nocookie.com"].includes(url.hostname)) {
          return null;
        }
        if (url.pathname === "/watch") return url.searchParams.get("v");
        const partes = url.pathname.split("/").filter(Boolean);
        if (["embed", "shorts", "live", "v"].includes(partes[0])) return partes[1] || null;
        return null;
      } catch { return null; }
    }

    function criarPlayer() {
      if (!videos.length) return;
      const video = videos[selecionado];
      const iframe = document.createElement("iframe");
      iframe.title = video.titulo;
      iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(video.id) + "?autoplay=1&playsinline=1&rel=0";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      const area = document.getElementById("player");
      area.replaceChildren(iframe);
      player = iframe;
    }

    function selecionarVideo(index) {
      selecionado = index;
      [...lista.children].forEach((botao, i) => botao.classList.toggle("ativo", i === index));
      if (videos[index]) criarPlayer();
    }

    function irParaTema(tema) {
      const url = new URL(window.location.href);
      if (tema === "Todos") url.searchParams.delete("tema");
      else url.searchParams.set("tema", tema);
      window.location.href = url.pathname + url.search + url.hash;
    }

    function montarMenu() {
      const temaEscolhido = temaDaURL();
      const temas = ["Todos", ...new Set(todosVideos.map(v => v.tema))];
      temasMenu.replaceChildren();

      temas.forEach(tema => {
        const botao = document.createElement("button");
        botao.textContent = tema === "Todos" ? "📺  Todos os vídeos" : "▶  " + tema;
        botao.classList.toggle("ativo", tema === temaEscolhido);
        botao.addEventListener("click", () => {
          fecharMenu();
          if (tema !== temaEscolhido) irParaTema(tema);
          else fecharMenu();
        });
        temasMenu.appendChild(botao);
      });
    }

    function montarLista() {
      const temaEscolhido = temaDaURL();
      videos = temaEscolhido === "Todos"
        ? [...todosVideos]
        : todosVideos.filter(video => video.tema.toLocaleLowerCase() === temaEscolhido.toLocaleLowerCase());

      temaAtual.textContent = temaEscolhido === "Todos" ? "Todos os temas" : temaEscolhido;
      lista.replaceChildren();

      if (!videos.length) {
        status.textContent = "Não há vídeos neste tema. Confira as categorias em youtube.txt.";
        if (player) player.remove();
        player = null;
        return;
      }

      videos.forEach((video, index) => {
        const botao = document.createElement("button");
        botao.textContent = `${index + 1}. ${video.titulo}`;
        botao.addEventListener("click", () => selecionarVideo(index));
        lista.appendChild(botao);
      });

      selecionarVideo(0);
      status.textContent = "Tema: " + (temaEscolhido === "Todos" ? "Todos os vídeos" : temaEscolhido)
        + " — " + videos.length + " vídeo(s).";
      criarPlayer();
    }

    async function carregarLista() {
      try {
        const resposta = await fetch("./youtube.txt?v=" + Date.now(), { cache: "no-store" });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        const texto = await resposta.text();

        todosVideos = texto.split(/\r?\n/)
          .map(linha => linha.trim())
          .filter(linha => linha && !linha.startsWith("#"))
          .map((linha, indice) => {
            const partes = linha.split("|").map(parte => parte.trim());
            let tema, titulo, url;

            if (partes.length >= 3) {
              tema = partes[0] || "Geral";
              titulo = partes[1] || "Vídeo " + (indice + 1);
              url = partes.slice(2).join("|").trim();
            } else if (partes.length === 2) {
              // Compatibilidade com o formato antigo: Título|URL
              tema = "Geral";
              titulo = partes[0] || "Vídeo " + (indice + 1);
              url = partes[1];
            } else {
              tema = "Geral";
              titulo = "Vídeo " + (indice + 1);
              url = partes[0];
            }

            const id = extrairId(url);
            return id ? { tema, titulo, id } : null;
          })
          .filter(Boolean);

        montarMenu();
        montarLista();
      } catch (erro) {
        console.error(erro);
        status.textContent = "Erro ao ler youtube.txt. Verifique se o arquivo está publicado no GitHub Pages.";
      }
    }

    carregarLista();
  </script>
</body>
</html>
