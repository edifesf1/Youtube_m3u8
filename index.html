<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Youtube IPTV</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #fff; font-family: Arial, sans-serif; }
    header {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px;
      background: #c00; padding: 10px 16px; min-height: 60px;
      position: sticky; top: 0; z-index: 8;
    }
    #temaAtual { display: none; }
    main { max-width: 1000px; margin: auto; padding: 16px; }
    /* O player acompanha o fluxo da página para não cobrir a tarja vermelha. */
    #player {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 8px 18px rgba(0,0,0,.55);
    }
    #player iframe { display: block; width: 100%; height: 100%; border: 0; }
    #status, #lista { position: relative; z-index: 1; }
    #status { padding: 12px 0; color: #ccc; }
    #lista { display: grid; gap: 8px; }
    #lista button {
      width: 100%; padding: 15px; text-align: left; color: white;
      background: #292929; border: 1px solid #444; border-radius: 6px;
      font-size: 16px; cursor: pointer;
    }
    #lista button:focus, #lista button.ativo {
      border-color: #f44; background: #383030; outline: 2px solid #c00;
    }
    #drawerOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 9; display: none;
    }
    #drawerOverlay.aberto { display: block; }
    #drawer {
      width: min(320px, 86vw); height: 100%; overflow-y: auto;
      background: #1b1b1b; box-shadow: 4px 0 16px rgba(0,0,0,.4);
      padding: 0 0 20px;
    }
    .drawerHeader {
      display: flex; justify-content: space-between; align-items: center;
      background: #c00; padding: 17px 16px; font-size: 20px; font-weight: bold;
    }
    #closeMenu {
      border: 0; color: #fff; background: transparent; font-size: 28px; cursor: pointer;
    }
    .menuIntro { color: #bbb; font-size: 13px; padding: 15px 16px 8px; }
    #temasMenu { display: grid; }
    #temasMenu button {
      background: transparent; border: 0; color: #eee; text-align: left;
      padding: 14px 18px; font-size: 16px; cursor: pointer;
      border-bottom: 1px solid #333;
    }
    #temasMenu button:hover, #temasMenu button.ativo { background: #383030; color: #fff; border-left: 4px solid #f33; }
    @media (max-width: 600px) {
      #temaAtual { font-size: 12px; }
      main { padding: 10px; }
    }


    /* Menu flutuante em cascata A1 -> B2 -> C3 -> D4 */
    #cascadeBar {
      position: static; z-index: auto;
      display: flex; align-items: center; flex: 1 1 auto; gap: 7px;
      min-width: 0; padding: 0; background: transparent;
      border: 0; box-shadow: none; overflow-x: auto;
    }
    .cascade-group { display: flex; min-width: 0; flex: 1 1 0; }
    .cascade-group label { display: none; }
    .cascade-group select {
      width: 100%; min-width: 0; max-width: 240px; padding: 9px 25px 9px 8px;
      border: 1px solid rgba(255,255,255,.45); border-radius: 5px; background: #a90000; color: #fff;
      font-size: 14px; outline: none;
    }
    .cascade-group select:focus { border-color: #fff; }
    .cascade-group[hidden] { display: none; }
    @media (max-width: 600px) {
      header { gap: 6px; padding: 8px; }
      #cascadeBar { gap: 5px; }
      .cascade-group select { max-width: none; font-size: 12px; padding: 8px 18px 8px 5px; }
    }

    body.bloqueado { overflow: hidden; }
    #telaLogin {
      position: fixed; inset: 0; z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at top, #3a1010, #090909 65%);
    }
    #caixaLogin {
      width: min(420px, 100%); padding: 30px; border-radius: 16px;
      background: #1b1b1b; border: 1px solid #454545;
      box-shadow: 0 18px 60px rgba(0,0,0,.55); text-align: center;
    }
    #caixaLogin h1 { margin: 0 0 8px; font-size: 26px; }
    #caixaLogin p { color: #bbb; line-height: 1.5; }
    #campoLogin {
      width: 100%; padding: 14px; margin: 12px 0; border-radius: 8px;
      border: 1px solid #555; background: #101010; color: white;
      font-size: 18px; text-align: center; text-transform: uppercase;
    }
    #entrarLogin {
      width: 100%; padding: 14px; border: 0; border-radius: 8px;
      background: #c00; color: white; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    #entrarLogin:hover { background: #e11; }
    #erroLogin { min-height: 22px; color: #ff7777; font-size: 14px; }
    body.bloqueado > header, body.bloqueado > #drawerOverlay, body.bloqueado > main { visibility: hidden; }

  </style>
</head>
<body class="bloqueado">
  <section id="telaLogin" aria-label="Tela de login">
    <form id="caixaLogin">
      <h1>Youtube IPTV</h1>
      <p>Digite seu login de acesso para continuar.<br>Não é necessária senha.</p>
      <input id="campoLogin" name="login" autocomplete="off" autocapitalize="characters" placeholder="Ex.: YTXXXXXXXX" maxlength="10" required>
      <button id="entrarLogin" type="submit">ENTRAR</button>
      <div id="erroLogin" role="alert"></div>
    </form>
  </section>

  <header>
    <nav id="cascadeBar" aria-label="Filtros">
      <div class="cascade-group" id="grupoA1">
        <label for="menuA1">Tema</label>
        <select id="menuA1" title="Tema" aria-label="Tema"><option value=""></option></select>
      </div>
      <div class="cascade-group" id="grupoB2" hidden>
        <label for="menuB2">Categoria</label>
        <select id="menuB2" title="Categoria" aria-label="Categoria"><option value=""></option></select>
      </div>
      <div class="cascade-group" id="grupoC3" hidden>
        <label for="menuC3">Classificação</label>
        <select id="menuC3" title="Classificação" aria-label="Classificação"><option value=""></option></select>
      </div>
      <div class="cascade-group" id="grupoD4" hidden>
        <label for="menuD4">Episódio</label>
        <select id="menuD4" title="Episódio" aria-label="Episódio"><option value=""></option></select>
      </div>
    </nav>
  </header>



  <main>
    <div id="player"></div>
    <div id="status">Carregando lista de vídeos...</div>
    <div id="lista"></div>
  </main>

  <script>

    // A lista de logins é carregada diretamente de LOGINS-200.txt.
    // Assim, alterações nesse arquivo passam a valer sem editar o index.html.
    let LOGINS_VALIDOS = [];
    const telaLogin = document.getElementById("telaLogin");
    const campoLogin = document.getElementById("campoLogin");
    const erroLogin = document.getElementById("erroLogin");
    const botaoEntrar = document.getElementById("entrarLogin");

    async function carregarLogins() {
      botaoEntrar.disabled = true;
      erroLogin.textContent = "Carregando logins...";
      try {
        const resposta = await fetch("./LOGINS-200.txt?v=" + Date.now(), { cache: "no-store" });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        const texto = await resposta.text();
        LOGINS_VALIDOS = [...new Set(texto.split(/\r?\n/)
          .map(linha => linha.trim().toUpperCase())
          .filter(linha => /^YT[A-Z0-9]{8}$/.test(linha)))];
        if (LOGINS_VALIDOS.length === 0) throw new Error("Nenhum login válido encontrado");
        erroLogin.textContent = "";
        botaoEntrar.disabled = false;
        validarLoginSalvo();
      } catch (erro) {
        console.error("Erro ao carregar LOGINS-200.txt:", erro);
        erroLogin.textContent = "Não foi possível carregar os logins. Verifique se LOGINS-200.txt foi publicado no GitHub.";
      }
    }

    function liberarAcesso(login) {
      document.body.classList.remove("bloqueado");
      telaLogin.style.display = "none";
      sessionStorage.setItem("youtubeIptvLogin", login);
    }
    function validarLoginSalvo() {
      const salvo = sessionStorage.getItem("youtubeIptvLogin");
      if (salvo && LOGINS_VALIDOS.includes(salvo)) liberarAcesso(salvo);
      else sessionStorage.removeItem("youtubeIptvLogin");
    }
    document.getElementById("caixaLogin").addEventListener("submit", function(event) {
      event.preventDefault();
      const login = campoLogin.value.trim().toUpperCase();
      if (LOGINS_VALIDOS.includes(login)) {
        erroLogin.textContent = "";
        liberarAcesso(login);
      } else {
        erroLogin.textContent = "Login inválido. Confira o código e tente novamente.";
        campoLogin.select();
      }
    });
    carregarLogins();

    let todosVideos = [];
    let videos = [];
    let player = null;
    let selecionado = 0;

    const status = document.getElementById("status");
    const lista = document.getElementById("lista");
    const menuA1 = document.getElementById("menuA1");
    const menuB2 = document.getElementById("menuB2");
    const menuC3 = document.getElementById("menuC3");
    const menuD4 = document.getElementById("menuD4");
    const grupos = {
      A1: document.getElementById("grupoA1"),
      B2: document.getElementById("grupoB2"),
      C3: document.getElementById("grupoC3"),
      D4: document.getElementById("grupoD4"),
    };

    function preencherSelect(select, valores) {
      select.replaceChildren();
      const inicial = document.createElement("option");
      inicial.value = "";
      inicial.textContent = "";
      select.appendChild(inicial);
      [...new Set(valores.filter(Boolean))].sort((a,b) => a.localeCompare(b, "pt-BR")).forEach(valor => {
        const option = document.createElement("option");
        option.value = valor;
        option.textContent = valor;
        select.appendChild(option);
      });
      select.value = "";
    }

    function mostrarGrupo(nome, mostrar) { grupos[nome].hidden = !mostrar; }

    function limparAbaixo(nivel) {
      if (nivel <= 1) { menuB2.value = ""; mostrarGrupo("B2", false); }
      if (nivel <= 2) { menuC3.value = ""; mostrarGrupo("C3", false); }
      if (nivel <= 3) { menuD4.value = ""; mostrarGrupo("D4", false); }
    }

    function aplicarFiltros() {
      const tema = menuA1.value;
      const categoria = menuB2.value;
      const classificacao = menuC3.value;
      const episodio = menuD4.value;
      videos = todosVideos.filter(v =>
        (!tema || v.tema === tema) &&
        (!categoria || v.categoria === categoria) &&
        (!classificacao || v.classificacao === classificacao) &&
        (!episodio || v.titulo === episodio)
      );
      lista.replaceChildren();
      const area = document.getElementById("player");
      area.replaceChildren();
      player = null;

      if (!videos.length) {
        status.textContent = tema ? "Nenhum vídeo nesta seleção." : "Selecione os menus acima.";
        return;
      }
      videos.forEach((video, index) => {
        const botao = document.createElement("button");
        botao.textContent = `${index + 1}. ${video.titulo}`;
        botao.addEventListener("click", () => {
          selecionado = index;
          [...lista.children].forEach((b, i) => b.classList.toggle("ativo", i === index));
          criarPlayer();
        });
        lista.appendChild(botao);
      });
      selecionado = 0;
      [...lista.children].forEach((b, i) => b.classList.toggle("ativo", i === 0));
      status.textContent = `${videos.length} vídeo(s).`;
      if (episodio && videos.length === 1) criarPlayer();
    }

    menuA1.addEventListener("change", () => {
      limparAbaixo(1);
      const tema = menuA1.value;
      if (tema) {
        preencherSelect(menuB2, todosVideos.filter(v => v.tema === tema).map(v => v.categoria));
        mostrarGrupo("B2", true);
      }
      aplicarFiltros();
    });

    menuB2.addEventListener("change", () => {
      limparAbaixo(2);
      const { tema, categoria } = { tema: menuA1.value, categoria: menuB2.value };
      if (tema && categoria) {
        preencherSelect(menuC3, todosVideos.filter(v => v.tema === tema && v.categoria === categoria).map(v => v.classificacao));
        mostrarGrupo("C3", true);
      }
      aplicarFiltros();
    });

    menuC3.addEventListener("change", () => {
      limparAbaixo(3);
      const tema = menuA1.value, categoria = menuB2.value, classificacao = menuC3.value;
      if (tema && categoria && classificacao) {
        preencherSelect(menuD4, todosVideos.filter(v => v.tema === tema && v.categoria === categoria && v.classificacao === classificacao).map(v => v.titulo));
        mostrarGrupo("D4", true);
      }
      aplicarFiltros();
    });

    menuD4.addEventListener("change", aplicarFiltros);

    function extrairId(valor) {
      try {
        const url = new URL(valor);
        if (url.hostname === "youtu.be") {
          return url.pathname.split("/").filter(Boolean)[0] || null;
        }
        if (!["youtube.com", "www.youtube.com", "m.youtube.com",
              "youtube-nocookie.com", "www.youtube-nocookie.com"].includes(url.hostname)) {
          return null;
        }
        if (url.pathname === "/watch") return url.searchParams.get("v");
        const partes = url.pathname.split("/").filter(Boolean);
        if (["embed", "shorts", "live", "v"].includes(partes[0])) return partes[1] || null;
        return null;
      } catch { return null; }
    }

    function criarPlayer() {
      if (!videos.length) return;
      const video = videos[selecionado];
      const iframe = document.createElement("iframe");
      iframe.title = video.titulo;
      iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(video.id) + "?autoplay=1&playsinline=1&rel=0";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      const area = document.getElementById("player");
      area.replaceChildren(iframe);
      player = iframe;
    }

    async function carregarLista() {
      try {
        const resposta = await fetch("./youtube.txt?v=" + Date.now(), { cache: "no-store" });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        const texto = await resposta.text();

        todosVideos = texto.split(/\r?\n/)
          .map(linha => linha.trim())
          .filter(linha => linha && !linha.startsWith("#"))
          .map((linha, indice) => {
            const partes = linha.split("|").map(parte => parte.trim());
            let tema, categoria, classificacao, titulo, url;

            if (partes.length >= 5) {
              // Formato novo: Tema|Categoria|Classificação|Episódio/Título|URL
              [tema, categoria, classificacao, titulo] = partes;
              url = partes.slice(4).join("|").trim();
            } else if (partes.length >= 3) {
              // Compatibilidade: Tema|Título|URL
              const temaAntigo = partes[0] || "Geral";
              titulo = partes[1] || "Vídeo " + (indice + 1);
              url = partes.slice(2).join("|").trim();
              tema = /bíblic|preg|igreja|relig|estudo/i.test(temaAntigo + " " + titulo) ? "religioso" : "normal";
              categoria = /live|ao vivo|rádio|radio|notícia|cnn|jovem pan|record news|sbt news/i.test(titulo + " " + url) ? "live" : "filmes";
              classificacao = temaAntigo;
            } else if (partes.length === 2) {
              titulo = partes[0] || "Vídeo " + (indice + 1);
              url = partes[1];
              tema = "normal"; categoria = "filmes"; classificacao = "Geral";
            } else {
              titulo = "Vídeo " + (indice + 1);
              url = partes[0];
              tema = "normal"; categoria = "filmes"; classificacao = "Geral";
            }

            // Preserve a grafia original do youtube.txt, incluindo letras maiúsculas.
            tema = tema || "Normal";
            categoria = categoria || "Filmes";
            classificacao = classificacao || "Geral";
            titulo = titulo || "Vídeo " + (indice + 1);
            const id = extrairId(url);
            return id ? { tema, categoria, classificacao, titulo, id, url } : null;
          })
          .filter(Boolean);

        preencherSelect(menuA1, todosVideos.map(v => v.tema));
        limparAbaixo(1);
        aplicarFiltros();
      } catch (erro) {
        console.error(erro);
        status.textContent = "Erro ao ler youtube.txt. Verifique se o arquivo está publicado no GitHub Pages.";
      }
    }

    carregarLista();
  </script>
</body>
</html>
